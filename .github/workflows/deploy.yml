name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: eventhub
          POSTGRES_PASSWORD: eventhub_pass
          POSTGRES_DB: eventhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: eventhub-api
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install aiosqlite  # For SQLite test DB

      - name: Run tests
        working-directory: eventhub-api
        env:
          DATABASE_URL: sqlite+aiosqlite:///:memory:
          SECRET_KEY: test-secret-key-for-ci
          ENVIRONMENT: test
        run: |
          pytest tests/ -v --cov=app --cov-report=term-missing --cov-fail-under=70

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to EC2 instances
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST_1: ${{ secrets.EC2_HOST_1 }}
          EC2_HOST_2: ${{ secrets.EC2_HOST_2 }}
        run: |
          echo "$EC2_SSH_KEY" > key.pem
          chmod 600 key.pem
          for HOST in $EC2_HOST_1 $EC2_HOST_2; do
            ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@$HOST "
              cd /app/eventhub
              git pull origin main
              pip install -r eventhub-api/requirements.txt
              cd eventhub-api
              alembic upgrade head
              sudo systemctl restart eventhub
            "
          done
          rm key.pem

      - name: Build and deploy frontend to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          VITE_API_URL: ${{ secrets.ALB_URL }}
        run: |
          cd eventhub-ui
          npm ci
          npm run build
          aws s3 sync dist/ s3://eventhub-images/dist/ --delete
